services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: genigo
      MYSQL_DATABASE: genigo_test
    ports:
      - "3307:3306"
    volumes:
      - ./testdata/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pgenigo"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: genigo
      POSTGRES_PASSWORD: genigo
      POSTGRES_DB: genigo_test
    ports:
      - "5433:5432"
    volumes:
      - ./testdata/postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genigo -d genigo_test"]
      interval: 3s
      timeout: 3s
      retries: 20
